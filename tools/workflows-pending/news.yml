name: Refresh news

# Daily: pull public RSS feeds, label items (model check if ANTHROPIC_API_KEY is set), rebuild the pages, commit if anything changed.
on:
  schedule:
    - cron: '17 11 * * *'   # 11:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and label news
        env:
          # Optional. Without it every item is labeled by keyword rules ("rules-only").
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 tools/news/fetch_news.py
      - name: Scan for possible new public appearances (review list only, never published automatically)
        run: python3 tools/news/scan_events.py
      - name: Rebuild pages
        run: python3 tools/build.py
      - name: Sanity checks
        run: python3 tools/check_site.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/news_cache.json data/events_candidates.json news.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh news feed [skip ci]"
            git pull --rebase --autostash
            git push
          fi
