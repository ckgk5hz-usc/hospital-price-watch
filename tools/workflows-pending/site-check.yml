name: Site check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Data files valid, no Infinity/NaN, internal links resolve
        run: python3 tools/check_site.py
      - name: Generated pages are up to date with their sources (warning only)
        continue-on-error: true
        run: |
          python3 tools/build.py
          git diff --exit-code --stat
